name: Build aria2-next

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-aria2-next
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 (Official Way)
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
      TARGET_PROCESSOR: x86_64
      RUNTIME_PLATFORM: windows-x86_64
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: true
      # 注入你自定义的极速体积优化参数
      RELEASE_CFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w"
      RELEASE_CXXFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -ftemplate-depth=1024"
      RELEASE_LDFLAGS: "-static -static-libgcc -Wl,--gc-sections -flto=thin"

    steps:
      # ---------- 1. 上游更新检测 ----------
      - name: Restore upstream SHA cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-
    
      - name: Check upstream changes
        id: check
        run: |
          mkdir -p .cache
          NEW_SHA=$(git ls-remote https://github.com/AnInsomniacy/aria2-next.git HEAD | cut -f1)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          if [ "$FORCE_BUILD" = "1" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          fi

      # ---------- 2. 检出仓库与工具链准备 ----------
      - name: Checkout own repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: own-repo

      - name: Clone upstream aria2-next
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next
          ref: main
          path: aria2-next

      - name: Install build tools & LLVM-MinGW
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make cmake ninja-build perl curl tar binutils jq dpkg-dev

          # 自动下载官方脚本依赖环境中的 LLVM-MinGW (Clang + LLD)
          cd aria2-next
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
          cd ..

      # ---------- 3. 配置工具链环境变量 ----------
      - name: Configure toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          prefix=x86_64-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"

      # ---------- 4. 动态在线抓取最新依赖版本并注入补丁 ----------
      - name: Patch options & auto-update dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # 1. 1K 超小分片大小补丁
          sed -i 's/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1M", 1_m, 1_g))/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1K", 1_k, 1_g))/g' src/OptionHandlerFactory.cc || true

          # 2. 强制 WinConsoleFile 默认支持颜色
          python3 - <<'EOF'
          from pathlib import Path
          import re
          p = Path("src/WinConsoleFile.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'bool\s+WinConsoleFile::supportsColor\(\)\s*\{[^}]*\}', 
                         'bool WinConsoleFile::supportsColor() { return true; }', s)
              p.write_text(s)
          EOF

          # 3. 在线自动探测各依赖库的最新版本并更新 dependencies.env
          python3 - <<'EOF'
          import urllib.request, json, re, hashlib
          from pathlib import Path

          def get_latest_github_release(repo):
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      return data.get("tag_name", "").lstrip("v").replace("R_", "").replace("_", ".")
              except Exception:
                  return None

          env_path = Path("packaging/dependencies.env")
          if env_path.exists():
              content = env_path.read_text()
              
              # 自动获取 Expat, c-ares, SQLite 等最新版本
              expat_ver = get_latest_github_release("libexpat/libexpat")
              cares_ver = get_latest_github_release("c-ares/c-ares")
              
              if expat_ver:
                  content = re.sub(r'^EXPAT_VERSION=.*', f'EXPAT_VERSION={expat_ver}', content, flags=re.M)
                  print(f"Auto-detected Expat latest: {expat_ver}")
              if cares_ver:
                  content = re.sub(r'^CARES_VERSION=.*', f'CARES_VERSION={cares_ver}', content, flags=re.M)
                  print(f"Auto-detected c-ares latest: {cares_ver}")

              env_path.write_text(content)
          EOF
          
      # ---------- 5. 调用官方脚本一键构建 ----------
      - name: Build release binary (Official Script)
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          packaging/scripts/build-release windows

      # ---------- 6. 打包与发布 ----------
      - name: Package binary
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p own-repo/release
          cp aria2-next/build/release/aria2-next.exe own-repo/release/aria2-next.exe

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-windows-x64
          path: own-repo/release/aria2-next.exe

      - name: Create Release
        if: success() && steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: aria2-next
          allowUpdates: true
          artifacts: own-repo/release/aria2-next.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save upstream SHA cache
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check.outputs.new_sha }}
        continue-on-error: true
