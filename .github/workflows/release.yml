name: Build aria2-next

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-aria2-next
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 (Official SuperBuild)
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
      TARGET_PROCESSOR: x86_64
      RUNTIME_PLATFORM: windows-x86_64
      ARIA2_BUILD_PROFILE: release
      CMAKE_BUILD_TYPE: Release
      STRIP_BINARY: true
      RELEASE_CFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error"
      RELEASE_CXXFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error -ftemplate-depth=1024"
      RELEASE_LDFLAGS: "-static -static-libgcc -Wl,--gc-sections -flto=thin"

    steps:
      # ---------- 1. 上游更新检测 ----------
      - name: Restore upstream SHA cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-
    
      - name: Check upstream changes
        id: check
        run: |
          mkdir -p .cache
          NEW_SHA=$(git ls-remote https://github.com/AnInsomniacy/aria2-next.git HEAD | cut -f1)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          if [ "$FORCE_BUILD" = "1" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          fi

      # ---------- 2. 检出与安装 LLVM-MinGW 工具链 ----------
      - name: Checkout own repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: own-repo

      - name: Clone upstream aria2-next (含 submodules)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next
          ref: main
          submodules: recursive
          path: aria2-next

      - name: Install build tools & LLVM-MinGW
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make cmake ninja-build perl curl tar binutils jq dpkg-dev

          cd aria2-next
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
          cd ..

      # ---------- 3. 配置工具链环境变量 ----------
      - name: Configure toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          prefix=x86_64-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"

      - name: Verify runner tools
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: packaging/scripts/verify-runner-tools windows-x86_64

      # ---------- 4. 预编译依赖并打通 SuperBuild ----------
      - name: Pre-build OpenSSL & nghttp2 & SQLite, patch SuperBuild
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # A. 1K 超小分片大小补丁
          sed -i 's/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1M", 1_m, 1_g))/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1K", 1_k, 1_g))/g' src/options/StreamOptions.cc || true

          # B. 强制 WinConsoleFile 默认支持颜色
          python3 - <<'EOF'
          from pathlib import Path
          import re
          p = Path("src/WinConsoleFile.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'bool\s+WinConsoleFile::supportsColor\(\)\s*\{[^}]*\}', 
                         'bool WinConsoleFile::supportsColor() { return true; }', s)
              p.write_text(s)
          EOF

          # C. 自动下载并覆盖升级所有依赖项源码 (Expat, SQLite, OpenSSL 4.0.2, Boost 1.92.0)
          python3 - <<'EOF'
          import urllib.request, os, tarfile, shutil
          from pathlib import Path

          def download_and_extract(url, target_dir, sub_path=None):
              print(f"Upgrading {target_dir} from {url} ...")
              archive_name = "temp_archive.tar.gz"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp, open(archive_name, 'wb') as f:
                  f.write(resp.read())
              
              shutil.rmtree(target_dir, ignore_errors=True)
              os.makedirs(target_dir, exist_ok=True)
              with tarfile.open(archive_name) as tar:
                  for member in tar.getmembers():
                      p = Path(member.name)
                      if len(p.parts) > 1:
                          if sub_path and sub_path not in p.parts:
                              continue
                          member.name = str(Path(*p.parts[1:]))
                          tar.extract(member, path=target_dir)
              os.remove(archive_name)
              print(f"Successfully upgraded {target_dir}")

          # 1. 自动升级 Expat
          try:
              download_and_extract("https://github.com/libexpat/libexpat/releases/download/R_2_8_4/expat-2.8.4.tar.gz", "third_party/expat")
          except Exception as e:
              print(f"Skip expat upgrade: {e}")

          # 2. 自动升级 SQLite
          try:
              download_and_extract("https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz", "third_party/sqlite")
          except Exception as e:
              print(f"Skip sqlite upgrade: {e}")

          # 3. 自动升级 OpenSSL
          try:
              download_and_extract("https://github.com/openssl/openssl/releases/download/openssl-4.0.2/openssl-4.0.2.tar.gz", "third_party/openssl")
          except Exception as e:
              print(f"Skip openssl upgrade: {e}")

          # 4. 自动升级 Boost
          try:
              download_and_extract("https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz", "third_party/boost", sub_path="boost")
          except Exception as e:
              print(f"Skip boost upgrade: {e}")
          EOF

          # D. 准备依赖安装目录
          mkdir -p build/release/dependencies/lib build/release/dependencies/include
          DEP_PREFIX="$PWD/build/release/dependencies"

          # E. 预编译静态 OpenSSL 4.0.2
          cd third_party/openssl
          ./Configure mingw64 -static \
            --prefix=/ \
            --openssldir=/etc/ssl \
            --libdir=lib \
            --cross-compile-prefix=x86_64-w64-mingw32- \
            CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib RC=x86_64-w64-mingw32-windres \
            no-shared no-tests no-docs no-apps no-asm no-autoload-config \
            -Os -pipe -g0 \
            --with-zlib-include="$DEP_PREFIX/include" \
            --with-zlib-lib="$DEP_PREFIX/lib/libz.a"
          make -j$(nproc) && make DESTDIR="$DEP_PREFIX" install_sw
          cd ../..

          # F. 极速 CMake 编译静态 nghttp2
          cd third_party/nghttp2
          cmake -B build-nghttp2 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_RC_COMPILER="$RC" \
            -DCMAKE_INSTALL_PREFIX="$DEP_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIB_ONLY=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_FAILMALLOC=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_C_FLAGS="$RELEASE_CFLAGS -w -g0 -DNDEBUG -ffile-prefix-map=$PWD=third_party/nghttp2"
          cmake --build build-nghttp2 --parallel $(nproc)
          cmake --install build-nghttp2
          cp -f "$DEP_PREFIX/lib/libnghttp2_static.a" "$DEP_PREFIX/lib/libnghttp2.a" 2>/dev/null || true
          cd ../..

          # G. 极速编译最新 SQLite (3.53.4)
          cd third_party/sqlite
          $CC $RELEASE_CFLAGS -g0 -DNDEBUG -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_DQS=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -c sqlite3.c -o sqlite3.o
          $AR rcs "$DEP_PREFIX/lib/libsqlite3.a" sqlite3.o
          $RANLIB "$DEP_PREFIX/lib/libsqlite3.a"
          cp sqlite3.h sqlite3ext.h "$DEP_PREFIX/include/"
          rm -f sqlite3.o
          cd ../..

          # H. 修复 Dependencies.cmake：直通三方库，并将 curl 的 TLS 后端从 Schannel 切换为高并发无锁的 OpenSSL
          python3 - <<'EOF'
          from pathlib import Path
          import re
          p = Path("cmake/superbuild/Dependencies.cmake")
          if p.exists():
              s = p.read_text()
              
              # 1. 直通已预编译的静态库
              s = re.sub(r'ExternalProject_Add\(openssl_project[\s\S]*?TEST_COMMAND ""\)', 'add_custom_target(openssl_project)', s)
              s = re.sub(r'ExternalProject_Add\(nghttp2_project[\s\S]*?TEST_COMMAND ""\)', 'add_custom_target(nghttp2_project)', s)
              s = re.sub(r'ExternalProject_Add\(sqlite_project[\s\S]*?TEST_COMMAND ""\)', 'add_custom_target(sqlite_project)', s)
              
              # 2. 核心切换：将 Windows 下 curl 的 TLS 后端改为 OpenSSL (解决并发握手报错)
              old_win32_curl = "if(WIN32)\n  set(ARIA2_CURL_TLS_ARGS\n    -DCURL_USE_OPENSSL=OFF\n    -DCURL_USE_SCHANNEL=ON)\n  set(ARIA2_CURL_TRUST_DEFINE USE_SCHANNEL)\n  list(REMOVE_ITEM ARIA2_CURL_DEPENDENCIES openssl_project)"
              new_win32_curl = "if(WIN32)\n  set(ARIA2_CURL_TLS_ARGS\n    -DCURL_USE_OPENSSL=ON\n    -DCURL_USE_SCHANNEL=OFF\n    -DCURL_USE_LIBPSL=OFF\n    -DOPENSSL_ROOT_DIR=${ARIA2_DEPENDENCY_PREFIX}\n    -DOPENSSL_USE_STATIC_LIBS=ON\n    -DOPENSSL_INCLUDE_DIR=${ARIA2_DEPENDENCY_PREFIX}/include\n    -DOPENSSL_CRYPTO_LIBRARY=${ARIA2_DEPENDENCY_PREFIX}/lib/libcrypto.a\n    -DOPENSSL_SSL_LIBRARY=${ARIA2_DEPENDENCY_PREFIX}/lib/libssl.a)\n  set(ARIA2_CURL_TRUST_DEFINE USE_OPENSSL)"
              s = s.replace(old_win32_curl, new_win32_curl)

              p.write_text(s)
          EOF

          # I. 核心修复：移除 cmake/modules/Dependencies.cmake 中的 OpenSSL 3.0.0 版本强制锁定
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("cmake/modules/Dependencies.cmake")
          if p.exists():
              s = p.read_text()
              # 允许 OpenSSL 4.x / 任意版本通过校验
              s = s.replace('find_package(OpenSSL ${ARIA2_MIN_OPENSSL_VERSION}', 'find_package(OpenSSL')
              s = s.replace('${ARIA2_MIN_LIBTORRENT_VERSION}', '')
              s = s.replace('${ARIA2_MIN_CURL_VERSION}', '')
              p.write_text(s)
          EOF

          # J. 同步更新 -v 字符串中的版本号
          python3 - <<'EOF'
          from pathlib import Path
          import re
          p = Path("src/FeatureConfig.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'expat/[0-9.]+', 'expat/2.8.4', s)
              s = re.sub(r'sqlite3/[0-9.]+', 'sqlite3/3.53.4', s)
              s = re.sub(r'OpenSSL/[0-9.]+', 'OpenSSL/4.0.2', s)
              s = re.sub(r'Boost/[0-9.]+', 'Boost/1.92.0', s)
              p.write_text(s)
          EOF
          # K. 让所有 CMake 依赖使用 MinSizeRel（-Os -DNDEBUG），而不是 Release（-O3 -DNDEBUG）
          python3 - <<'EOF'
          from pathlib import Path
          import re

          p = Path("packaging/scripts/build-release")
          if not p.exists():
              raise SystemExit("packaging/scripts/build-release not found")

          s = p.read_text()

          # 1. 顶层 CMake build type
          s2 = s.replace('-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_BUILD_TYPE=MinSizeRel')
          # 2. 脚本内部的 build_type 变量
          s2 = re.sub(r'^build_type=Release$', 'build_type=MinSizeRel', s2, flags=re.M)
          # 3. 如果脚本里有 CMAKE_BUILD_TYPE 引用
          s2 = re.sub(r'CMAKE_BUILD_TYPE:\s*Release', 'CMAKE_BUILD_TYPE: MinSizeRel', s2)
          s2 = re.sub(r'build_type\s*=\s*Release', 'build_type=MinSizeRel', s2)

          if s2 == s:
              print("build-release: no Release->MinSizeRel replacement matched; check manually")
          else:
              p.write_text(s2)
              print("Patched packaging/scripts/build-release - using MinSizeRel")
          EOF

      # ---------- 5. 官方 SuperBuild 一键极速构建 ----------
      - name: Patch Media.cmake for GPAC mingw
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # 1. 修复 GPAC 在 Linux 交叉编译时头文件大小写问题
          find third_party/gpac -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -print0 | \
            xargs -0 -r sed -i \
              -e 's/WinSock2\.h/winsock2.h/g' \
              -e 's/Windows\.h/windows.h/g' \
              -e 's/WS2tcpip\.h/ws2tcpip.h/g'

          # 2. 修复 GPAC setup.h 中禁用的 strcpy/strncpy/strcat/strncat 宏
          #    这些宏会污染 aria2 的 <cstring> 头文件，导致 using ::strcpy 展开失败
          python3 - <<'EOF'
          from pathlib import Path
          import re

          p = Path("third_party/gpac/include/gpac/setup.h")
          if not p.exists():
              raise SystemExit("gpac/setup.h not found")

          s = p.read_text()
          s2 = re.sub(
              r'#ifndef\s+GPAC_ALLOW_UNSAFE_STRFUNC',
              '#if 0',
              s
          )
          if s2 == s:
              print("Pattern '#ifndef GPAC_ALLOW_UNSAFE_STRFUNC' not found; skip")
          else:
              p.write_text(s2)
              print("Patched gpac/setup.h - disabled strcpy/strcat #error macros")
          EOF

          # 3. Media.cmake 补丁：GPAC 交叉编译参数 + FFmpeg 体积优化
          python3 - <<'EOF'
          from pathlib import Path
          import re

          p = Path("cmake/superbuild/Media.cmake")
          s = p.read_text()

          # 3a. GPAC 的 BUILD_COMMAND 补丁（保持原样）
          old = '''BUILD_COMMAND ${media_environment} ${ARIA2_MAKE_EXECUTABLE} -C src -j${ARIA2_BUILD_JOBS} lib'''

          new = '''BUILD_COMMAND ${media_environment}
            CC=${CMAKE_C_COMPILER}
            CXX=${CMAKE_CXX_COMPILER}
            CFLAGS="${media_cflags}"
            CPPFLAGS="${media_cflags}"
            LDFLAGS="${media_ldflags}"
            ${ARIA2_MAKE_EXECUTABLE} -C src -j${ARIA2_BUILD_JOBS} lib'''

          if old in s:
              s = s.replace(old, new)
          else:
              print("WARN: GPAC BUILD_COMMAND pattern not found")

          # 3b. FFmpeg configure 加 --enable-small（体积优先）
          #     匹配 --enable-static 或 --disable-shared 之后追加
          if "--enable-small" not in s:
              # 尝试多种插入点
              inserted = False
              for anchor in ["--enable-static", "--disable-shared", "--disable-programs"]:
                  if anchor in s:
                      s = s.replace(anchor, anchor + "\n    --enable-small", 1)
                      inserted = True
                      print(f"Inserted --enable-small after {anchor}")
                      break
              if not inserted:
                  print("WARN: could not locate FFmpeg configure anchor; check Media.cmake manually")
          else:
              print("--enable-small already present")

          p.write_text(s)
          EOF
  
      - name: Build release binary
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        shell: bash
        run: |
          bash packaging/scripts/build-release windows 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: aria2-next/build.log
      # ---------- 6. 打包与发布 ----------
      - name: Package binary
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p own-repo/release
          cp aria2-next/build/release/aria2-next.exe own-repo/release/aria2-next.exe

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-windows-x64
          path: own-repo/release/aria2-next.exe

      - name: Create Release
        if: success() && steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: aria2-next
          allowUpdates: true
          artifacts: own-repo/release/aria2-next.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save upstream SHA cache
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check.outputs.new_sha }}
        continue-on-error: true
