name: Build aria2-next

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-aria2-next
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
      HOST: x86_64-w64-mingw32
      PREFIX: /usr/local/x86_64-w64-mingw32
      CC: x86_64-w64-mingw32-gcc-posix
      CXX: x86_64-w64-mingw32-g++-posix
      CFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=auto -g0 -fno-ident"
      CXXFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=auto -g0 -fno-ident"
      LDFLAGS: "-static -static-libgcc -static-libstdc++ -Wl,--gc-sections,--strip-all -flto=auto"
      PKG_CONFIG_PATH: "/usr/local/x86_64-w64-mingw32/lib/pkgconfig"
      PKG_CONFIG_LIBDIR: "/usr/local/x86_64-w64-mingw32/lib/pkgconfig"

    steps:
      # ---------- 1. 恢复缓存（动态键，前缀匹配） ----------
      - name: Restore upstream SHA cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-
    
      - name: Check upstream changes
        id: check
        run: |
          mkdir -p .cache
          NEW_SHA=$(git ls-remote https://github.com/AnInsomniacy/aria2-next.git HEAD | cut -f1)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          echo "NEW_SHA=$NEW_SHA"
          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          echo "OLD_SHA=$OLD_SHA"
          if [ "$FORCE_BUILD" = "1" ]; then
            echo "Force build enabled."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "No upstream changes. Skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New commit detected. Starting build."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          fi

      # ---------- 以下所有步骤仅在 skip != true 时执行 ----------
      - name: Checkout own repository (for artifacts)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          path: own-repo

      - name: Clone upstream aria2-next
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: AnInsomniacy/aria2-next
          ref: main
          path: aria2-next

      - name: Install build tools
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt update
          sudo apt install -y \
            make cmake ninja-build pkg-config binutils curl tar dpkg-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Prepare prefix
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo rm -rf $PREFIX
          sudo mkdir -p \
           $PREFIX/include \
           $PREFIX/lib \
           $PREFIX/lib/pkgconfig \
           $PREFIX/share/pkgconfig     
          sudo chown -R $USER:$USER $PREFIX

      # ---------- 依赖库编译 ----------
      - name: Build expat
        if: steps.check.outputs.skip != 'true'
        run: |
          expat_json=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/libexpat/libexpat/releases/latest)
          expat_tag=$(
              jq -r '.tag_name' <<<"$expat_json" |
              sed 's/R_//' |
              tr '_' '.'
          )
          expat_latest_url=$(
              jq -r '.assets[] |
              select(.name|test("\\.tar\\.bz2$")) |
              .browser_download_url' <<<"$expat_json" |
              head -n1
          )
          echo "libexpat最新版本是${expat_tag} ，下载地址是${expat_latest_url}"
          curl -L ${expat_latest_url} | tar xj
          cd expat-*
          ./configure \
              --disable-shared \
              --enable-static \
              --without-examples \
              --without-tests \
              --enable-silent-rules \
              --prefix=$PREFIX \
              --host=$HOST \
              --build=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE)
          make -j$(nproc) install
          echo "EXPAT_VERSION=${expat_tag}" >> $GITHUB_ENV
          cd ..

      - name: Build zlib
        if: steps.check.outputs.skip != 'true'
        run: |
          zlib_json=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/madler/zlib/releases/latest)
          zlib_tag=$(
              jq -r '.name' <<<"$zlib_json" |
              cut -d' ' -f2
          )
          zlib_latest_url=$(
              jq -r '.assets[] |
              select(.name|test("\\.tar\\.gz$")) |
              .browser_download_url' <<<"$zlib_json" |
              head -n1
          )
          echo "zlib最新版本是${zlib_tag} ，下载地址是${zlib_latest_url}"
          curl -L ${zlib_latest_url} | tar xz
          cd zlib-*
          CC=$CC CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" ./configure --static --prefix=$PREFIX
          make -j$(nproc)
          make install
          echo "ZLIB_VERSION=${zlib_tag}" >> $GITHUB_ENV
          cd ..

      - name: Build sqlite3
        if: steps.check.outputs.skip != 'true'
        run: |
          sqlite_tag=$(curl -s https://sqlite.org/index.html | awk '/Version [0-9]+\.[0-9]+\.[0-9]+/ {match($0, /Version ([0-9]+\.[0-9]+\.[0-9]+)/, a); print a[1]; exit}')
          download_page=$(curl -sL "https://www.sqlite.org/download.html")
          csv_data=$(echo "$download_page" | sed -n '/Download product data for scripts to read/,/-->/p')
          tarball_url=$(echo "$csv_data" | grep "autoconf.*\.tar\.gz" | cut -d ',' -f 3 | head -n 1)
          sqlite_latest_url="https://www.sqlite.org/${tarball_url}"
          echo "sqlite最新版本是${sqlite_tag}，下载地址是${sqlite_latest_url}"
          curl -L "${sqlite_latest_url}" | tar xz
          cd sqlite-*
          CC=$CC CFLAGS="$CFLAGS" ./configure \
              --disable-shared \
              --enable-threadsafe \
              --enable-static \
              --disable-debug \
              --enable-silent-rules \
              --disable-editline \
              --disable-fts3 --disable-fts4 --disable-fts5 \
              --disable-rtree \
              --disable-session \
              --disable-load-extension \
              --prefix=$PREFIX \
              --host=$HOST \
              --build=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE) \
              LIBS="-lpthread"
          make -j$(nproc) libsqlite3.la || exit 1
          cp .libs/libsqlite3.a "$PREFIX/lib/" || cp libsqlite3.a "$PREFIX/lib/" || exit 1
          cp sqlite3.h sqlite3ext.h "$PREFIX/include/" || exit 1
          [ -f sqlite3.pc ] && cp sqlite3.pc "$PREFIX/lib/pkgconfig/"
          echo "SQLITE_VERSION=${sqlite_tag}" >> $GITHUB_ENV
          cd ..
          rm -rf sqlite-*

      - name: Build c-ares
        if: steps.check.outputs.skip != 'true'
        run: |
          CARES_VERSION=1.34.8
          curl -LO https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz
          tar xf c-ares-${CARES_VERSION}.tar.gz
          cd c-ares-${CARES_VERSION}
          ./configure --host=$HOST --build=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE) \
                      --prefix=$PREFIX --disable-shared --enable-static \
                      --enable-silent-rules --without-random --disable-tests \
                       LIBS="-lws2_32" CC=$CC
          make -j$(nproc)
          make install
          echo "CARES_VERSION=${CARES_VERSION}" >> $GITHUB_ENV
          cd ..

      - name: Build OpenSSL
        if: steps.check.outputs.skip != 'true'
        run: |
          OPENSSL_VERSION=4.0.1
          curl -LO https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz || exit 1
          tar xf openssl-${OPENSSL_VERSION}.tar.gz
          cd openssl-${OPENSSL_VERSION}
          DISABLED_FEATURES=(
            no-quic no-err no-dso no-engine no-async no-autoalginit
            no-sctp no-ssl3 no-tls1 no-tls1_1
            no-comp no-ts no-ocsp no-ct no-cms no-psk no-srp no-rfc3779
            no-fips no-acvp-tests no-docs no-stdio no-ui-console
            no-afalgeng no-ssl-trace no-filenames
            no-aria no-bf no-blake2 no-camellia no-cast no-cmac
            no-dh no-dsa no-ec2m no-gost no-idea no-rc2 no-rc4 no-rc5 no-rmd160
            no-scrypt no-seed no-siphash no-siv no-sm2 no-sm3 no-sm4 no-whirlpool
            no-tests no-apps
          )
          CC=gcc-posix ./Configure -static \
            --prefix=$PREFIX \
            --libdir=lib \
            --cross-compile-prefix=x86_64-w64-mingw32- \
            mingw64 no-shared \
            --with-zlib-include="$PREFIX/include" \
            --with-zlib-lib="$PREFIX/lib/libz.a" \
            "${DISABLED_FEATURES[@]}"
          make -j$(nproc) && make install_sw
          echo "OPENSSL_VERSION=${OPENSSL_VERSION}" >> $GITHUB_ENV
          cd ..
          
      - name: Build libssh2
        if: steps.check.outputs.skip != 'true'
        run: |
          libssh2_tag=$(
              curl -s https://libssh2.org/download/ |
              grep -oP 'libssh2-\K[0-9.]+(?=\.tar\.(gz|xz))' |
              sort -V |
              tail -n1
          )
          libssh2_latest_url="https://libssh2.org/download/libssh2-${libssh2_tag}.tar.gz"
          echo "libssh2最新版本是${libssh2_tag} ，下载地址是${libssh2_latest_url}"
          curl -L ${libssh2_latest_url} | tar xz
          cd libssh2-*
          ./configure \
              --disable-shared \
              --enable-static \
              --enable-silent-rules \
              --disable-examples-build \
              --disable-docker-tests \
              --disable-sshd-tests \
              --disable-debug \
              --prefix=$PREFIX \
              --host=$HOST \
              --build=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE) \
              LIBS="-lws2_32"
          make -j$(nproc) install
          echo "LIBSSH2_VERSION=${libssh2_tag}" >> $GITHUB_ENV
          cd ..

       # ---------- 4. Boost & Libtorrent 编译 ----------
      - name: Install Boost headers
        if: steps.check.outputs.skip != 'true'
        run: |
          # 自动获取 Boost 最新正式发布版本（如 1.87.0）
          BOOST_VER=$(curl -sL https://www.boost.io/feed/downloads.rss | grep -oP '<title>Version \K[0-9.]+' | head -n1)
          if [ -z "$BOOST_VER" ]; then
            BOOST_VER=$(curl -sL https://archives.boost.io/release/ | grep -oP 'href="\K[0-9.]+(?=/")' | sort -V | tail -n1)
          fi
          BOOST_UNDERSCORE=$(echo "$BOOST_VER" | tr '.' '_')
          BOOST_DIR="boost_${BOOST_UNDERSCORE}"
          echo "Boost 最新版本是: ${BOOST_VER}"
          echo "BOOST_VERSION=${BOOST_VER}" >> $GITHUB_ENV
          echo "BOOST_DIR_NAME=${BOOST_DIR}" >> $GITHUB_ENV
          echo "ARIA2_BOOST_ROOT=$GITHUB_WORKSPACE/${BOOST_DIR}" >> $GITHUB_ENV
          curl -L "https://archives.boost.io/release/${BOOST_VER}/source/${BOOST_DIR}.tar.gz" | tar -xz
          cp -r "${BOOST_DIR}/boost" "$PREFIX/include/"
          
      - name: Build libtorrent
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          LIBTORRENT_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/arvidn/libtorrent/releases/latest)
          LIBTORRENT_VERSION=$(echo "$LIBTORRENT_JSON" | jq -r '.tag_name' | sed 's/^v//')
          LIBTORRENT_URL=$(echo "$LIBTORRENT_JSON" | jq -r '.assets[] | select(.name | test("libtorrent-rasterbar-.*\\.tar\\.gz$")) | .browser_download_url' | head -n1)
          if [ -z "$LIBTORRENT_URL" ] || [ "$LIBTORRENT_URL" = "null" ]; then
            LIBTORRENT_URL="https://github.com/arvidn/libtorrent/releases/download/v${LIBTORRENT_VERSION}/libtorrent-rasterbar-${LIBTORRENT_VERSION}.tar.gz"
          fi
          echo "Libtorrent 最新版本是: ${LIBTORRENT_VERSION}"
          echo "下载地址是: ${LIBTORRENT_URL}"
          echo "LIBTORRENT_VERSION=${LIBTORRENT_VERSION}" >> $GITHUB_ENV
          curl -L "${LIBTORRENT_URL}" | tar xz
          cd libtorrent-rasterbar-${LIBTORRENT_VERSION}
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_RC_COMPILER="${HOST}-windres" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -Dstatic_runtime=ON \
            -Dwebtorrent=OFF \
            -Dlogging=OFF \
            -Ddeprecated-functions=OFF \
            -Dbuild_tests=OFF \
            -Dbuild_examples=OFF \
            -Dbuild_tools=OFF \
            -Dpython-bindings=OFF \
            -DOPENSSL_ROOT_DIR="$PREFIX" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBOOST_ROOT="$GITHUB_WORKSPACE/${BOOST_DIR_NAME}" \
            -DBoost_INCLUDE_DIR="$PREFIX/include" \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS"
          cmake --build build --target torrent-rasterbar --parallel $(nproc)
          cmake --install build
          cd ..
          rm -rf libtorrent-rasterbar-${LIBTORRENT_VERSION}
          
      # ---------- aria2-next 编译 ----------
      - name: Disable aria2 tests
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("aria2-next/cmake/modules/Tests.cmake")
          s = p.read_text()
          s = "if(ENABLE_TESTS)\n" + s + "\nendif()\n"
          p.write_text(s)
          EOF

      - name: Patch Dependencies.cmake
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # 1. 移除 OpenSSL 和 Libtorrent 的版本号强制校验变量
          sed -i 's/find_package(OpenSSL \${ARIA2_MIN_OPENSSL_VERSION}/find_package(OpenSSL/g' cmake/modules/Dependencies.cmake
          sed -i 's/find_package(LibtorrentRasterbar \${ARIA2_MIN_LIBTORRENT_VERSION}/find_package(LibtorrentRasterbar/g' cmake/modules/Dependencies.cmake

          # 2. 将 dependencies.env 里的硬编码版本号替换为你编译的实际版本（确保 -v 输出准确）
          [ -n "$ZLIB_VERSION" ]       && sed -i "s/^ZLIB_VERSION=.*/ZLIB_VERSION=${ZLIB_VERSION}/" packaging/dependencies.env
          [ -n "$EXPAT_VERSION" ]      && sed -i "s/^EXPAT_VERSION=.*/EXPAT_VERSION=${EXPAT_VERSION}/" packaging/dependencies.env
          [ -n "$SQLITE_VERSION" ]     && sed -i "s/^SQLITE_VERSION=.*/SQLITE_VERSION=${SQLITE_VERSION}/" packaging/dependencies.env
          [ -n "$CARES_VERSION" ]      && sed -i "s/^CARES_VERSION=.*/CARES_VERSION=${CARES_VERSION}/" packaging/dependencies.env
          [ -n "$OPENSSL_VERSION" ]    && sed -i "s/^OPENSSL_VERSION=.*/OPENSSL_VERSION=${OPENSSL_VERSION}/" packaging/dependencies.env
          [ -n "$LIBSSH2_VERSION" ]    && sed -i "s/^LIBSSH2_VERSION=.*/LIBSSH2_VERSION=${LIBSSH2_VERSION}/" packaging/dependencies.env
          [ -n "$LIBTORRENT_VERSION" ] && sed -i "s/^LIBTORRENT_VERSION=.*/LIBTORRENT_VERSION=${LIBTORRENT_VERSION}/" packaging/dependencies.env
          [ -n "$BOOST_VERSION" ]      && sed -i "s/^BOOST_VERSION=.*/BOOST_VERSION=${BOOST_VERSION}/" packaging/dependencies.env
      
      - name: Patch aria2 options (piece length)
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          sed -i 's/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1M", 1_m, 1_g))/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1K", 1_k, 1_g))/g' src/OptionHandlerFactory.cc
          sed -i 's/bool WinConsoleFile::supportsColor() { return false; }/bool WinConsoleFile::supportsColor() { return console_; }/' src/WinConsoleFile.cc
          sed -i '/console_ = handle_ != nullptr/,/GetConsoleMode(handle_, &mode) != 0;/c\  if (handle_ != nullptr && handle_ != INVALID_HANDLE_VALUE &&\n      GetConsoleMode(handle_, &mode) != 0) {\n    console_ = true;\n    SetConsoleMode(handle_, mode | 0x0004);\n  }' src/WinConsoleFile.cc
      
      - name: Configure aria2-next
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          rm -rf ./build
          cmake -S . -B build -G Ninja \
            -DENABLE_TESTS=OFF \
            -DARIA2_SUPERBUILD=OFF \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_RC_COMPILER="${HOST}-windres" \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIA2_STATIC_DEPENDENCIES=ON \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DOPENSSL_ROOT_DIR="$PREFIX" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DZLIB_ROOT="$PREFIX" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCARES_INCLUDE_DIR="$PREFIX/include" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
            -DCARES_LIBRARY="$PREFIX/lib/libcares.a" \
            -DEXPAT_INCLUDE_DIR="$PREFIX/include" \
            -DEXPAT_LIBRARY="$PREFIX/lib/libexpat.a" \
            -DSQLITE3_INCLUDE_DIR="$PREFIX/include" \
            -DSQLITE3_LIBRARY="$PREFIX/lib/libsqlite3.a" \
            -DLIBSSH2_INCLUDE_DIR="$PREFIX/include" \
            -DLIBSSH2_LIBRARY="$PREFIX/lib/libssh2.a" \
            -DARIA2_DEPENDENCY_ROOT="$PREFIX" \
            -DARIA2_BOOST_ROOT="$ARIA2_BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$PREFIX/include" \
            -DARIA2_WITH_WINTLS=OFF \
            -DARIA2_WITH_OPENSSL=ON \
            -DARIA2_WITH_GNUTLS=OFF \
            -DARIA2_WITH_CARES=ON \
            -DARIA2_WITH_SQLITE3=ON \
            -DARIA2_WITH_EXPAT=ON \
            -DARIA2_WITH_LIBSSH2=ON \
            -DARIA2_WITH_LIBXML2=OFF \
            -DARIA2_WITH_GMP=OFF \
            -DARIA2_WITH_LIBGCRYPT=OFF \
            -DARIA2_WITH_LIBNETTLE=OFF \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS"

      - name: Compile
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: cmake --build build --parallel $(nproc)

      - name: Package (strip)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p own-repo/release
          x86_64-w64-mingw32-strip --strip-all --remove-section=.comment --remove-section=.note aria2-next/build/aria2-next.exe -o own-repo/release/aria2-next.exe

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-windows-x64
          path: own-repo/release/aria2-next.exe

      - name: Create Release
        if: success() && steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: aria2-next
          allowUpdates: true
          artifacts: own-repo/release/aria2-next.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save upstream SHA cache
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check.outputs.new_sha }}
        continue-on-error: true
