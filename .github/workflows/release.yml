name: Build aria2-next

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-aria2-next
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 (Official SuperBuild)
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
      TARGET_PROCESSOR: x86_64
      RUNTIME_PLATFORM: windows-x86_64
      ARIA2_BUILD_PROFILE: release

      # 使用 MinSizeRel 优化体积
      CMAKE_BUILD_TYPE: MinSizeRel

      STRIP_BINARY: true
      RELEASE_CFLAGS: "-march=x86-64-v3 -O2 -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error"
      RELEASE_CXXFLAGS: "-march=x86-64-v3 -O2 -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error -ftemplate-depth=1024"
      RELEASE_LDFLAGS: "-static -static-libgcc -Wl,--gc-sections -flto=thin -Wl,--as-needed -Wl,-s"

      # 依赖版本号（统一在此修改）
      EXPAT_VERSION: "2.9.0"
      SQLITE_VERSION: "3.54.1"
      SQLITE_VERSION_NUM: "3540100"
      SQLITE_URL_YEAR: "2026"
      OPENSSL_VERSION: "4.1.0"
      BOOST_VERSION: "1.92.0"
      LIBTORRENT_VERSION: "2.1.2"

    steps:
      # ---------- 1. 上游更新检测 ----------
      - name: Restore upstream SHA cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-

      - name: Check upstream changes
        id: check
        run: |
          mkdir -p .cache
          NEW_SHA=$(git ls-remote https://github.com/AnInsomniacy/aria2-next.git HEAD | cut -f1)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          if [ "$FORCE_BUILD" = "1" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          fi

      # ---------- 2. 检出与安装 LLVM-MinGW 工具链 ----------
      - name: Checkout own repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: own-repo

      - name: Clone upstream aria2-next (含 submodules)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next
          ref: main
          submodules: recursive
          path: aria2-next

      - name: Install build tools & LLVM-MinGW
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make cmake ninja-build perl curl tar binutils jq dpkg-dev

          cd aria2-next
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
          cd ..

      # ---------- 3. 配置工具链环境变量 ----------
      - name: Configure toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          prefix=x86_64-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"

      - name: Verify runner tools
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: packaging/scripts/verify-runner-tools windows-x86_64

      # ---------- 3.5 单独为 OpenSSL 恢复/保存构建缓存 ----------
      - name: Restore OpenSSL cache
        if: steps.check.outputs.skip != 'true'
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: aria2-next/prebuilt-openssl
          key: openssl-${{ runner.os }}-${{ env.OPENSSL_VERSION }}-x86_64-v3-minizerel-v1

      # ---------- 4. 预编译依赖并打通 SuperBuild ----------
      - name: Pre-build OpenSSL & nghttp2 & SQLite, patch SuperBuild
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # A. 给 Console.cc 的进度行加 ANSI 颜色（跨平台 TTY/VT 兼容 + 顶部头文件注入）
          python3 - <<'PYEOF'
          from pathlib import Path
          import re
          import textwrap
          
          p = Path("src/app/Console.cc")
          if not p.exists():
              raise SystemExit(f"ERROR: {p} not found")
          s = p.read_text(encoding="utf-8")
          
          header_block = textwrap.dedent(r'''
          #if defined(_WIN32)
          #  ifndef NOMINMAX
          #    define NOMINMAX
          #  endif
          #  ifndef WIN32_LEAN_AND_MEAN
          #    define WIN32_LEAN_AND_MEAN
          #  endif
          #  include <windows.h>
          #  include <io.h>
          #  ifndef ENABLE_VIRTUAL_TERMINAL_PROCESSING
          #    define ENABLE_VIRTUAL_TERMINAL_PROCESSING 0x0004
          #  endif
          #else
          #  include <unistd.h>
          #endif
          #include <cstdlib>
          #include <cstdio>
          #include <string>
          ''').strip()

          if '#include' in s:
              first_include_pos = s.index('#include')
              s = s[:first_include_pos] + header_block + "\n\n" + s[first_include_pos:]
          else:
              raise SystemExit("ERROR: no #include found in Console.cc")

          pattern = re.compile(
              r'namespace \{\nstd::string describe\(const Task& task\)\n\{.*?\n\}\n\} // namespace',
              re.DOTALL
          )
          
          replacement = textwrap.dedent(r'''
          namespace {
          bool terminalSupportsColor()
          {
            static const bool supported = []() -> bool {
          #if defined(_WIN32)
              if (_isatty(_fileno(stdout)) == 0) {
                return false;
              }
              if (std::getenv("NO_COLOR") != nullptr) {
                return false;
              }
              HANDLE hOut = GetStdHandle(STD_OUTPUT_HANDLE);
              if (hOut == INVALID_HANDLE_VALUE || hOut == nullptr) {
                return false;
              }
              DWORD dwMode = 0;
              if (!GetConsoleMode(hOut, &dwMode)) {
                return false;
              }
              if (dwMode & ENABLE_VIRTUAL_TERMINAL_PROCESSING) {
                return true;
              }
              dwMode |= ENABLE_VIRTUAL_TERMINAL_PROCESSING;
              if (!SetConsoleMode(hOut, dwMode)) {
                return false;
              }
              return true;
          #else
              if (isatty(fileno(stdout)) == 0) {
                return false;
              }
              if (std::getenv("NO_COLOR") != nullptr) {
                return false;
              }
              const char* term = std::getenv("TERM");
              if (term && std::string(term) == "dumb") {
                return false;
              }
              return true;
          #endif
            }();
            return supported;
          }

          std::string colorize(const std::string& s, const char* c, bool useColor)
          {
            return useColor ? std::string(c) + s + "\x1b[0m" : s;
          }

          std::size_t visibleWidth(const std::string& s)
          {
            std::size_t w = 0;
            for (std::size_t i = 0; i < s.size(); ++i) {
              if (s[i] == '\x1b' && i + 1 < s.size() && s[i + 1] == '[') {
                i += 2;
                while (i < s.size() && s[i] != 'm') {
                  ++i;
                }
              } else {
                ++w;
              }
            }
            return w;
          }
          
          std::string describe(const Task& task)
          {
            const bool useColor = terminalSupportsColor();
            const auto total = task.totalLength();
            const auto done = task.completedLength();
            const auto speed = task.downloadSpeed();
          
            std::string line = "#" + gidText(task.gid()).substr(0, 6) + " " +
                               text::formatSize(done) + "/" + text::formatSize(total);
            if (total > 0) {
              line += colorize("(" + std::to_string(done * 100 / total) + "%)",
                               "\x1b[93m", useColor);
            }
            line += " CN:" + colorize(std::to_string(task.connections()),
                                      "\x1b[92m", useColor);
            line += " DL:" + colorize(text::formatSize(speed),
                                      "\x1b[94m", useColor);
            if (speed > 0 && total > done) {
              line += " ETA:" + colorize(text::formatDuration((total - done) / speed),
                                         "\x1b[38;5;203m", useColor);
            }
            return line;
          }
          } // namespace''').strip()
          
          s2, n = pattern.subn(lambda m: replacement, s)
          if n != 1:
              raise SystemExit(f"ERROR: describe() matched {n} times (expected 1)")
          s = s2
          
          old_width = "  const auto width = line.size();"
          new_width = "  const auto width = visibleWidth(line);"
          if old_width not in s:
              raise SystemExit("ERROR: readout() width anchor not found")
          s = s.replace(old_width, new_width, 1)
          
          p.write_text(s, encoding="utf-8")
          print("Patched Console.cc: colored readout + VT mode support (final)")
          PYEOF
          
          # B. 删除 libtorrent 1.x 遗留的 prefer_encrypted_connections 调用
          python3 - <<'PYEOF'
          from pathlib import Path

          p = Path("src/bt/Session.cc")
          if not p.exists():
              raise SystemExit("ERROR: src/bt/Session.cc not found")

          lines = p.read_text(encoding="utf-8").splitlines(True)
          kept = [l for l in lines if "prefer_encrypted_connections" not in l]

          if len(kept) == len(lines):
              print("Skipped: upstream already removed prefer_encrypted_connections")
          else:
              p.write_text("".join(kept), encoding="utf-8")
              print(f"Patched: removed {len(lines) - len(kept)} line(s)")
          PYEOF

          # C. 自动下载并覆盖升级核心依赖（必须保留，确保源码与 dependencies.env 同步更新）
          python3 - <<'PYEOF'
          import urllib.request, os, tarfile, shutil, re, tempfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          EXPAT_VERSION      = os.environ["EXPAT_VERSION"]
          SQLITE_VERSION     = os.environ["SQLITE_VERSION"]
          SQLITE_VERSION_NUM = os.environ["SQLITE_VERSION_NUM"]
          SQLITE_URL_YEAR    = os.environ["SQLITE_URL_YEAR"]
          OPENSSL_VERSION    = os.environ["OPENSSL_VERSION"]
          BOOST_VERSION      = os.environ["BOOST_VERSION"]
          LIBTORRENT_VERSION = os.environ["LIBTORRENT_VERSION"]

          EXPAT_URL      = f"https://github.com/libexpat/libexpat/releases/download/R_{EXPAT_VERSION.replace('.', '_')}/expat-{EXPAT_VERSION}.tar.gz"
          SQLITE_URL     = f"https://www.sqlite.org/{SQLITE_URL_YEAR}/sqlite-autoconf-{SQLITE_VERSION_NUM}.tar.gz"
          OPENSSL_URL    = f"https://github.com/openssl/openssl/releases/download/openssl-{OPENSSL_VERSION}/openssl-{OPENSSL_VERSION}.tar.gz"
          BOOST_URL      = f"https://archives.boost.io/release/{BOOST_VERSION}/source/boost_{BOOST_VERSION.replace('.', '_')}.tar.gz"
          LIBTORRENT_URL = f"https://github.com/arvidn/libtorrent/releases/download/v{LIBTORRENT_VERSION}/libtorrent-rasterbar-{LIBTORRENT_VERSION}.tar.gz"

          HAS_DATA_FILTER = hasattr(tarfile, 'data_filter')

          def download_and_extract(url, target_dir, sub_path=None):
              print(f"[START] Upgrading {target_dir} from {url} ...")
              with tempfile.NamedTemporaryFile(suffix=".tar.gz", delete=False) as tmp_file:
                  archive_path = tmp_file.name

              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (CI-Build)"})
                  with urllib.request.urlopen(req, timeout=60) as resp, open(archive_path, 'wb') as f:
                      shutil.copyfileobj(resp, f, length=64 * 1024)

                  shutil.rmtree(target_dir, ignore_errors=True)
                  os.makedirs(target_dir, exist_ok=True)

                  with tarfile.open(archive_path, mode="r:*") as tar:
                      for member in tar.getmembers():
                          p = Path(member.name)
                          if len(p.parts) > 1:
                              if sub_path and sub_path not in p.parts:
                                  continue
                              member.name = str(Path(*p.parts[1:]))
                              if HAS_DATA_FILTER:
                                  tar.extract(member, path=target_dir, filter='data')
                              else:
                                  tar.extract(member, path=target_dir)

                  print(f"[SUCCESS] Upgraded {target_dir}")
              except Exception as e:
                  print(f"[FAILED] Error upgrading {target_dir}: {e}")
                  raise e
              finally:
                  if os.path.exists(archive_path):
                      os.remove(archive_path)

          tasks = [
              (EXPAT_URL,      "third_party/expat", None),
              (SQLITE_URL,     "third_party/sqlite", None),
              (OPENSSL_URL,    "third_party/openssl", None),
              (BOOST_URL,      "third_party/boost", "boost"),
              (LIBTORRENT_URL, "third_party/libtorrent", None),
          ]

          with ThreadPoolExecutor(max_workers=5) as executor:
              futures = {executor.submit(download_and_extract, *task): task[1] for task in tasks}
              for future in as_completed(futures):
                  target = futures[future]
                  try:
                      future.result()
                  except Exception as exc:
                      raise SystemExit(f"Build Aborted: Dependency update failed for {target} -> {exc}")

          env_file = Path("packaging/dependencies.env")
          if env_file.exists():
              s = env_file.read_text(encoding="utf-8")
              s = re.sub(r'^EXPAT_VERSION=.*$',      f'EXPAT_VERSION={EXPAT_VERSION}',           s, flags=re.M)
              s = re.sub(r'^SQLITE_VERSION=.*$',     f'SQLITE_VERSION={SQLITE_VERSION}',         s, flags=re.M)
              s = re.sub(r'^OPENSSL_VERSION=.*$',    f'OPENSSL_VERSION={OPENSSL_VERSION}',       s, flags=re.M)
              s = re.sub(r'^BOOST_VERSION=.*$',      f'BOOST_VERSION={BOOST_VERSION}',           s, flags=re.M)
              s = re.sub(r'^LIBTORRENT_VERSION=.*$', f'LIBTORRENT_VERSION={LIBTORRENT_VERSION}', s, flags=re.M)
              env_file.write_text(s, encoding="utf-8")
              print("[SUCCESS] Updated packaging/dependencies.env with new versions")
          else:
              raise SystemExit("ERROR: packaging/dependencies.env not found")
          PYEOF

          # D. 准备依赖安装目录
          mkdir -p build/release/dependencies/lib build/release/dependencies/include
          DEP_PREFIX="$PWD/build/release/dependencies"
          OPENSSL_CACHE="$PWD/prebuilt-openssl"

          # E. 预编译静态 OpenSSL（纯净对称安装 + 深度裁剪）
          if [ "${{ steps.openssl-cache.outputs.cache-hit }}" = "true" ] && [ -d "$OPENSSL_CACHE/lib" ]; then
            echo "=========================================================="
            echo "[CACHE HIT] Restoring OpenSSL from cache (0 seconds)!"
            echo "=========================================================="
          else
            echo "=========================================================="
            echo "[CACHE MISS] Building trimmed OpenSSL from source..."
            echo "=========================================================="
            rm -rf "$OPENSSL_CACHE"
            mkdir -p "$OPENSSL_CACHE"
            cd third_party/openssl
            ./Configure mingw64 \
              --prefix=/ \
              --openssldir=/etc/ssl \
              --libdir=lib \
              --cross-compile-prefix=x86_64-w64-mingw32- \
              CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib RC=x86_64-w64-mingw32-windres \
              no-shared no-module no-tests no-docs no-apps no-autoload-config \
              enable-legacy \
              no-comp no-psk no-nextprotoneg \
              no-cmp no-dgram no-cms no-ts no-ct no-srp no-srtp \
              no-ui-console no-ssl-trace no-http \
              no-aria no-bf no-camellia no-cast no-idea no-md4 no-rc2 \
              no-seed no-sm3 no-sm4 no-whirlpool no-rmd160 \
              no-blake2 no-cmac no-siphash \
              no-kbkdf no-krb5kdf no-pvkkdf no-scrypt no-sshkdf no-sskdf \
              no-x942kdf no-x963kdf no-snmpkdf no-srtpkdf \
              no-ocb no-multiblock no-rfc3779 no-pinshared \
              no-dtls no-quic no-ml-dsa no-ml-kem no-slh-dsa \
              -Os -pipe -g0
            make -j$(nproc) && make DESTDIR="$OPENSSL_CACHE" install_sw
            cd ../..
          fi
          cp -r "$OPENSSL_CACHE/include/"* "$DEP_PREFIX/include/"
          cp -r "$OPENSSL_CACHE/lib/"* "$DEP_PREFIX/lib/"

          # F. CMake 编译静态 nghttp2
          cd third_party/nghttp2
          cmake -B build-nghttp2 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_RC_COMPILER="$RC" \
            -DCMAKE_INSTALL_PREFIX="$DEP_PREFIX" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DENABLE_LIB_ONLY=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_FAILMALLOC=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_C_FLAGS="$RELEASE_CFLAGS -w -g0 -DNDEBUG -ffile-prefix-map=$PWD=third_party/nghttp2"
          cmake --build build-nghttp2 --parallel $(nproc)
          cmake --install build-nghttp2
          cp -f "$DEP_PREFIX/lib/libnghttp2_static.a" "$DEP_PREFIX/lib/libnghttp2.a" 2>/dev/null || true
          cd ../..

          # G. 编译 SQLite
          cd third_party/sqlite
          $CC $RELEASE_CFLAGS -g0 -DNDEBUG -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_DQS=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -c sqlite3.c -o sqlite3.o
          $AR rcs "$DEP_PREFIX/lib/libsqlite3.a" sqlite3.o
          $RANLIB "$DEP_PREFIX/lib/libsqlite3.a"
          cp sqlite3.h sqlite3ext.h "$DEP_PREFIX/include/"
          rm -f sqlite3.o
          cd ../..

          # H. SuperBuild 补丁
          python3 - <<'PYEOF'
          from pathlib import Path
          import re

          p = Path("cmake/superbuild/Dependencies.cmake")
          if not p.exists():
              raise SystemExit("ERROR: cmake/superbuild/Dependencies.cmake not found!")

          s = p.read_text(encoding="utf-8")

          for proj in ["openssl_project", "nghttp2_project", "sqlite_project"]:
              pattern = rf'ExternalProject_Add\(\s*{proj}[\s\S]*?TEST_COMMAND\s+""\s*\)'
              s, count = re.subn(pattern, f'add_custom_target({proj})', s)
              if count == 0:
                  raise SystemExit(
                      f"ERROR: H1 anchor not found for {proj}; "
                      "cmake/superbuild/Dependencies.cmake may have been restructured upstream."
                  )
              print(f"Patched: ExternalProject_Add({proj}) -> add_custom_target({proj})")

          p.write_text(s, encoding="utf-8")

          s2 = p.read_text(encoding="utf-8")
          for marker in ["add_custom_target(openssl_project)",
                         "add_custom_target(nghttp2_project)",
                         "add_custom_target(sqlite_project)"]:
              if marker not in s2:
                  raise SystemExit(f"ERROR: H1 self-check failed, missing: {marker}")
          print("H1 self-check passed")

          if "-DCURL_USE_SCHANNEL=ON" in s2 and "-DCURL_USE_OPENSSL=OFF" in s2:
              print("H2 skipped by design: keeping official Windows Schannel cURL backend")

          dep_mod = Path("cmake/modules/Dependencies.cmake")
          if dep_mod.exists():
              t = dep_mod.read_text(encoding="utf-8")
              before = t
              t = t.replace(
                  'find_package(OpenSSL ${ARIA2_MIN_OPENSSL_VERSION}',
                  'find_package(OpenSSL'
              )
              if t != before:
                  dep_mod.write_text(t, encoding="utf-8")
                  print("Patched cmake/modules/Dependencies.cmake (removed OpenSSL version pin)")
              else:
                  print("Skipped: OpenSSL version pin already removed or anchor not found")
          else:
              print("Skipped: cmake/modules/Dependencies.cmake not present")
          PYEOF

          # I. 同步更新 -v 字符串中的版本号
          python3 - <<'PYEOF'
          from pathlib import Path
          import re, os

          EXPAT_VERSION      = os.environ["EXPAT_VERSION"]
          SQLITE_VERSION     = os.environ["SQLITE_VERSION"]
          OPENSSL_VERSION    = os.environ["OPENSSL_VERSION"]
          BOOST_VERSION      = os.environ["BOOST_VERSION"]
          LIBTORRENT_VERSION = os.environ["LIBTORRENT_VERSION"]

          p = Path("src/FeatureConfig.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'expat/[0-9.]+',                f'expat/{EXPAT_VERSION}',             s)
              s = re.sub(r'sqlite3/[0-9.]+',              f'sqlite3/{SQLITE_VERSION}',          s)
              s = re.sub(r'OpenSSL/[0-9.]+',              f'OpenSSL/{OPENSSL_VERSION}',         s)
              s = re.sub(r'Boost/[0-9.]+',                f'Boost/{BOOST_VERSION}',             s)
              s = re.sub(r'libtorrent/[0-9.]+',           f'libtorrent/{LIBTORRENT_VERSION}',   s)
              s = re.sub(r'LibtorrentRasterbar/[0-9.]+',  f'libtorrent/{LIBTORRENT_VERSION}',   s)
              p.write_text(s)
              print(f"FeatureConfig.cc updated: expat/{EXPAT_VERSION}, sqlite3/{SQLITE_VERSION}, OpenSSL/{OPENSSL_VERSION}, Boost/{BOOST_VERSION}, libtorrent/{LIBTORRENT_VERSION}")
          PYEOF
          
      # ---------- 5. Media.cmake修复 + FFmpeg 体积优化 ----------
      - name: Patch Media.cmake and optimize FFmpeg
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          sed -i 's|^set(media_cflags "\${CMAKE_C_FLAGS}")|set(media_cflags "\${CMAKE_C_FLAGS} -DGPAC_ALLOW_UNSAFE_STRFUNC")|' \
            cmake/superbuild/Media.cmake
          grep -q 'GPAC_ALLOW_UNSAFE_STRFUNC' cmake/superbuild/Media.cmake \
            || { echo "ERROR: Media.cmake patch anchor not found"; exit 1; }
          echo "Patched Media.cmake: added -DGPAC_ALLOW_UNSAFE_STRFUNC"
          
          python3 - <<'PYEOF'
          from pathlib import Path

          p = Path('cmake/superbuild/Media.cmake')
          if not p.exists():
              raise SystemExit('Media.cmake not found')

          s = p.read_text()
          if '--enable-small' not in s:
              old = '--enable-pic --enable-static'
              new = '--enable-pic --enable-static\n    --enable-small'
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s)
                  print('Added FFmpeg --enable-small')
              else:
                  raise SystemExit('FFmpeg configure anchor not found')
          else:
              print('--enable-small already exists')
          PYEOF

      # ---------- 6. 构建 ----------
      - name: Build release binary
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        shell: bash
        run: |
          bash packaging/scripts/build-release windows 2>&1 | tee build.log

      # ---------- 7. 校验 ----------
      - name: Verify actual dependency versions (source + installed)
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          echo "===== [1] Source tree versions ====="
          echo -n "Expat     : "
          grep -A2 'project(expat' third_party/expat/CMakeLists.txt 2>/dev/null \
            | grep -m1 -oP '\d+\.\d+\.\d+' || echo "N/A"
          echo -n "SQLite    : "
          grep -m1 -oP '#define\s+SQLITE_VERSION\s+"\K[0-9.]+' third_party/sqlite/sqlite3.h 2>/dev/null || echo "N/A"
          echo -n "OpenSSL   : "
          grep -m1 -oP 'OPENSSL_VERSION_TEXT\s+"[^0-9]*\K[0-9][0-9.a-z]*' third_party/openssl/include/openssl/opensslv.h 2>/dev/null || echo "N/A"
          echo -n "Boost     : "
          grep -m1 -oP '#define\s+BOOST_VERSION\s+\K[0-9]+' third_party/boost/boost/version.hpp 2>/dev/null \
            | awk '{printf "%d.%d.%d\n", $1/100000, ($1/100)%1000, $1%100}' || echo "N/A"
          echo -n "libtorrent: "
          grep -m1 -oP '#define\s+LIBTORRENT_VERSION\s+"\K[0-9.]+' third_party/libtorrent/include/libtorrent/version.hpp 2>/dev/null || echo "N/A"

          echo
          echo "===== [2] Installed dependency header versions ====="
          INC=build/release/dependencies/include
          ver() {
            [ -f "$2" ] || { printf '%-10s: N/A (file not found)\n' "$1"; return; }
            out="$(eval "$3" 2>/dev/null || true)"
            printf '%-10s: %s\n' "$1" "${out:-N/A}"
          }
          ver Expat "$INC/expat.h" \
            "sed -nE 's/^#[[:space:]]*define[[:space:]]+XML_(MAJOR|MINOR|MICRO)_VERSION[[:space:]]+([0-9]+).*/\\2/p' \"$INC/expat.h\" | paste -sd. -"
          ver SQLite "$INC/sqlite3.h" \
            "grep -m1 -oP '#define\s+SQLITE_VERSION\s+\"\K[0-9.]+' \"$INC/sqlite3.h\""         
          ver OpenSSL "$INC/openssl/opensslv.h" \
            "grep -m1 -oP 'OPENSSL_VERSION_TEXT\s+\"[^0-9]*\K[0-9][0-9.a-z]*' \"$INC/openssl/opensslv.h\""
          ver libtorrent "$INC/libtorrent/version.hpp" \
            "grep -m1 -oP '#define\s+LIBTORRENT_VERSION\s+\"\K[0-9.]+' \"$INC/libtorrent/version.hpp\""

          echo

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: aria2-next/build.log

      # ---------- 8. 打包与发布 ----------
      - name: Package binary
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p own-repo/release
          BIN="aria2-next/build/release/aria2-next.exe"
          x86_64-w64-mingw32-strip -s "$BIN"
          cp aria2-next/build/release/aria2-next.exe own-repo/release/aria2-next.exe

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-windows-x64
          path: own-repo/release/aria2-next.exe

      - name: Create Release
        if: success() && steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: aria2-next
          allowUpdates: true
          artifacts: own-repo/release/aria2-next.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save upstream SHA cache
        if: success() && steps.check.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check.outputs.new_sha }}
        continue-on-error: true
