name: Build aria2-next

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-aria2-next
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 (Official SuperBuild)
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}
      TARGET_PROCESSOR: x86_64
      RUNTIME_PLATFORM: windows-x86_64
      ARIA2_BUILD_PROFILE: release

      # 使用 MinSizeRel 优化体积
      CMAKE_BUILD_TYPE: MinSizeRel

      STRIP_BINARY: true
      RELEASE_CFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error"
      RELEASE_CXXFLAGS: "-march=x86-64-v3 -Os -pipe -ffunction-sections -fdata-sections -flto=thin -g0 -w -Wno-error -ftemplate-depth=1024"
      RELEASE_LDFLAGS: "-static -static-libgcc -Wl,--gc-sections -flto=thin"

      # 依赖版本号（统一在此修改）
      EXPAT_VERSION: "2.9.0"
      SQLITE_VERSION: "3.53.4"
      SQLITE_VERSION_NUM: "3530400"
      SQLITE_URL_YEAR: "2026"
      OPENSSL_VERSION: "4.0.3"
      BOOST_VERSION: "1.92.0"
      LIBTORRENT_VERSION: "2.1.2"

    steps:
      # ---------- 1. 上游更新检测 ----------
      - name: Restore upstream SHA cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-

      - name: Check upstream changes
        id: check
        run: |
          mkdir -p .cache
          NEW_SHA=$(git ls-remote https://github.com/AnInsomniacy/aria2-next.git HEAD | cut -f1)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          if [ "$FORCE_BUILD" = "1" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "$NEW_SHA" > .cache/last_sha
          fi

      # ---------- 2. 检出与安装 LLVM-MinGW 工具链 ----------
      - name: Checkout own repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: own-repo

      - name: Clone upstream aria2-next (含 submodules)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next
          ref: main
          submodules: recursive
          path: aria2-next

      - name: Install build tools & LLVM-MinGW
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make cmake ninja-build perl curl tar binutils jq dpkg-dev

          cd aria2-next
          . packaging/dependencies.env
          . packaging/scripts/common.sh
          curl_fetch "$LLVM_MINGW_URL" "$LLVM_MINGW_ARCHIVE" "$LLVM_MINGW_SHA256"
          tar xf "$LLVM_MINGW_ARCHIVE"
          echo "$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
          cd ..

      # ---------- 3. 配置工具链环境变量 ----------
      - name: Configure toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          prefix=x86_64-w64-mingw32
          {
            echo "CC=${prefix}-clang"
            echo "CXX=${prefix}-clang++"
            echo "RC=${prefix}-windres"
            echo "AR=${prefix}-ar"
            echo "RANLIB=${prefix}-ranlib"
            echo "STRIP=${prefix}-strip"
            echo "OBJDUMP=${prefix}-objdump"
          } >> "$GITHUB_ENV"

      - name: Verify runner tools
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: packaging/scripts/verify-runner-tools windows-x86_64

      # ---------- 4. 预编译依赖并打通 SuperBuild ----------
      - name: Pre-build OpenSSL & nghttp2 & SQLite, patch SuperBuild
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # A. 1K 超小分片大小补丁
          sed -i 's/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1M", 1_m, 1_g))/PREF_PIECE_LENGTH, TEXT_PIECE_LENGTH, "1K", 1_k, 1_g))/g' src/options/StreamOptions.cc || true

          # B. 强制 WinConsoleFile 默认支持颜色
          python3 - <<'PYEOF'
          from pathlib import Path
          import re
          p = Path("src/WinConsoleFile.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'bool\s+WinConsoleFile::supportsColor\(\)\s*\{[^}]*\}',
                         'bool WinConsoleFile::supportsColor() { return true; }', s)
              p.write_text(s)
          PYEOF

          # B2. 删除 libtorrent 2.1 中已移除的废弃设置项
          python3 - <<'PYEOF'
          from pathlib import Path
          import re

          p = Path("src/BtSettings.cc")
          if not p.exists():
              print("WARNING: src/BtSettings.cc not found")
          else:
              s = p.read_text()
              s2 = re.sub(
                  r'\s*settings\.set_(?:bool|int)\(lt::settings_pack::(?:prefer_encrypted_connections|allowed_enc_level|prefer_rc4),\s*[^;]*?\);\n',
                  '\n', s)
              if s2 == s:
                  print("WARNING: BtSettings.cc: no deprecated setting removed; check manually")
              else:
                  p.write_text(s2)
                  print("Patched src/BtSettings.cc: removed prefer_encrypted_connections, allowed_enc_level, prefer_rc4")
          PYEOF

          # C. 自动下载并覆盖升级核心依赖
          #    核心依赖下载失败即停：避免"下载失败 -> 用旧版本构建 -> 假成功"
          python3 - <<'PYEOF'
          import urllib.request, os, tarfile, shutil, re
          from pathlib import Path

          EXPAT_VERSION      = os.environ["EXPAT_VERSION"]
          SQLITE_VERSION     = os.environ["SQLITE_VERSION"]
          SQLITE_VERSION_NUM = os.environ["SQLITE_VERSION_NUM"]
          SQLITE_URL_YEAR    = os.environ["SQLITE_URL_YEAR"]
          OPENSSL_VERSION    = os.environ["OPENSSL_VERSION"]
          BOOST_VERSION      = os.environ["BOOST_VERSION"]
          LIBTORRENT_VERSION = os.environ["LIBTORRENT_VERSION"]

          EXPAT_URL      = f"https://github.com/libexpat/libexpat/releases/download/R_{EXPAT_VERSION.replace('.', '_')}/expat-{EXPAT_VERSION}.tar.gz"
          SQLITE_URL     = f"https://www.sqlite.org/{SQLITE_URL_YEAR}/sqlite-autoconf-{SQLITE_VERSION_NUM}.tar.gz"
          OPENSSL_URL    = f"https://github.com/openssl/openssl/releases/download/openssl-{OPENSSL_VERSION}/openssl-{OPENSSL_VERSION}.tar.gz"
          BOOST_URL      = f"https://archives.boost.io/release/{BOOST_VERSION}/source/boost_{BOOST_VERSION.replace('.', '_')}.tar.gz"
          LIBTORRENT_URL = f"https://github.com/arvidn/libtorrent/releases/download/v{LIBTORRENT_VERSION}/libtorrent-rasterbar-{LIBTORRENT_VERSION}.tar.gz"

          def download_and_extract(url, target_dir, sub_path=None):
              print(f"Upgrading {target_dir} from {url} ...")
              archive_name = "temp_archive.tar.gz"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp, open(archive_name, 'wb') as f:
                  f.write(resp.read())

              shutil.rmtree(target_dir, ignore_errors=True)
              os.makedirs(target_dir, exist_ok=True)
              with tarfile.open(archive_name) as tar:
                  for member in tar.getmembers():
                      p = Path(member.name)
                      if len(p.parts) > 1:
                          if sub_path and sub_path not in p.parts:
                              continue
                          member.name = str(Path(*p.parts[1:]))
                          tar.extract(member, path=target_dir)
              os.remove(archive_name)
              print(f"Successfully upgraded {target_dir}")

          # 失败即停，不吞异常
          download_and_extract(EXPAT_URL,      "third_party/expat")
          download_and_extract(SQLITE_URL,     "third_party/sqlite")
          download_and_extract(OPENSSL_URL,    "third_party/openssl")
          download_and_extract(BOOST_URL,      "third_party/boost", sub_path="boost")
          download_and_extract(LIBTORRENT_URL, "third_party/libtorrent")

          # 同步更新 dependencies.env 中的版本号声明
          env_file = Path("packaging/dependencies.env")
          if env_file.exists():
              s = env_file.read_text()
              s = re.sub(r'^EXPAT_VERSION=.*$',      f'EXPAT_VERSION={EXPAT_VERSION}',           s, flags=re.M)
              s = re.sub(r'^SQLITE_VERSION=.*$',     f'SQLITE_VERSION={SQLITE_VERSION}',         s, flags=re.M)
              s = re.sub(r'^OPENSSL_VERSION=.*$',    f'OPENSSL_VERSION={OPENSSL_VERSION}',       s, flags=re.M)
              s = re.sub(r'^BOOST_VERSION=.*$',      f'BOOST_VERSION={BOOST_VERSION}',           s, flags=re.M)
              s = re.sub(r'^LIBTORRENT_VERSION=.*$', f'LIBTORRENT_VERSION={LIBTORRENT_VERSION}', s, flags=re.M)
              env_file.write_text(s)
              print("Updated packaging/dependencies.env with new versions")
          else:
              raise SystemExit("ERROR: packaging/dependencies.env not found")
          PYEOF

          # D. 准备依赖安装目录
          mkdir -p build/release/dependencies/lib build/release/dependencies/include
          DEP_PREFIX="$PWD/build/release/dependencies"

          # E. 预编译静态 OpenSSL（保留 ASM，不添加 no-asm）
          cd third_party/openssl
          ./Configure mingw64 -static \
            --prefix=/ \
            --openssldir=/etc/ssl \
            --libdir=lib \
            --cross-compile-prefix=x86_64-w64-mingw32- \
            CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib RC=x86_64-w64-mingw32-windres \
            no-shared no-tests no-docs no-apps no-autoload-config \
            -Os -pipe -g0 \
            --with-zlib-include="$DEP_PREFIX/include" \
            --with-zlib-lib="$DEP_PREFIX/lib/libz.a"
          make -j$(nproc) && make DESTDIR="$DEP_PREFIX" install_sw
          cd ../..

          # F. CMake 编译静态 nghttp2
          cd third_party/nghttp2
          cmake -B build-nghttp2 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_RC_COMPILER="$RC" \
            -DCMAKE_INSTALL_PREFIX="$DEP_PREFIX" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DENABLE_LIB_ONLY=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_FAILMALLOC=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_C_FLAGS="$RELEASE_CFLAGS -w -g0 -DNDEBUG -ffile-prefix-map=$PWD=third_party/nghttp2"
          cmake --build build-nghttp2 --parallel $(nproc)
          cmake --install build-nghttp2
          cp -f "$DEP_PREFIX/lib/libnghttp2_static.a" "$DEP_PREFIX/lib/libnghttp2.a" 2>/dev/null || true
          cd ../..

          # G. 编译 SQLite
          cd third_party/sqlite
          $CC $RELEASE_CFLAGS -g0 -DNDEBUG -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_DQS=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -c sqlite3.c -o sqlite3.o
          $AR rcs "$DEP_PREFIX/lib/libsqlite3.a" sqlite3.o
          $RANLIB "$DEP_PREFIX/lib/libsqlite3.a"
          cp sqlite3.h sqlite3ext.h "$DEP_PREFIX/include/"
          rm -f sqlite3.o
          cd ../..

          # H. SuperBuild 补丁
          #    H1: 直通三方库 + curl TLS 切换 OpenSSL
          #    H2: libtorrent 警告抑制（仅减少日志，不改产物）
          #    H3: 移除 OpenSSL 版本锁
          python3 - <<'PYEOF'
          from pathlib import Path
          import re

          # ---------- H1. cmake/superbuild/Dependencies.cmake ----------
          p = Path("cmake/superbuild/Dependencies.cmake")
          if p.exists():
              s = p.read_text()

              # 1. 直通已预编译的静态库
              s = re.sub(r'ExternalProject_Add\(openssl_project[\s\S]*?TEST_COMMAND ""\)',
                         'add_custom_target(openssl_project)', s)
              s = re.sub(r'ExternalProject_Add\(nghttp2_project[\s\S]*?TEST_COMMAND ""\)',
                         'add_custom_target(nghttp2_project)', s)
              s = re.sub(r'ExternalProject_Add\(sqlite_project[\s\S]*?TEST_COMMAND ""\)',
                         'add_custom_target(sqlite_project)', s)

              # 2. curl TLS 后端切换为 OpenSSL
              old_win32_curl = (
                  "if(WIN32)\n"
                  "  set(ARIA2_CURL_TLS_ARGS\n"
                  "    -DCURL_USE_OPENSSL=OFF\n"
                  "    -DCURL_USE_SCHANNEL=ON)\n"
                  "  set(ARIA2_CURL_TRUST_DEFINE USE_SCHANNEL)\n"
                  "  list(REMOVE_ITEM ARIA2_CURL_DEPENDENCIES openssl_project)"
              )
              new_win32_curl = (
                  "if(WIN32)\n"
                  "  set(ARIA2_CURL_TLS_ARGS\n"
                  "    -DCURL_USE_OPENSSL=ON\n"
                  "    -DCURL_USE_SCHANNEL=OFF\n"
                  "    -DCURL_USE_LIBPSL=OFF\n"
                  "    -DOPENSSL_ROOT_DIR=${ARIA2_DEPENDENCY_PREFIX}\n"
                  "    -DOPENSSL_USE_STATIC_LIBS=ON\n"
                  "    -DOPENSSL_INCLUDE_DIR=${ARIA2_DEPENDENCY_PREFIX}/include\n"
                  "    -DOPENSSL_CRYPTO_LIBRARY=${ARIA2_DEPENDENCY_PREFIX}/lib/libcrypto.a\n"
                  "    -DOPENSSL_SSL_LIBRARY=${ARIA2_DEPENDENCY_PREFIX}/lib/libssl.a)\n"
                  "  set(ARIA2_CURL_TRUST_DEFINE USE_OPENSSL)"
              )
              s = s.replace(old_win32_curl, new_win32_curl)

              p.write_text(s)
              print("Patched cmake/superbuild/Dependencies.cmake")

          # ---------- H2. libtorrent 警告抑制 ----------
          p = Path("third_party/libtorrent/CMakeLists.txt")
          if p.exists():
              s = p.read_text()
              marker = "WORKFLOW_WARNING_SUPPRESSION"
              if marker not in s:
                  lines_to_add = [
                      "",
                      "# ===== WORKFLOW_WARNING_SUPPRESSION =====",
                      "# 仅抑制 Clang 对 libtorrent 源码产生的无害警告，",
                      "# 不改变编译产物，也不提升性能",
                      'if(CMAKE_CXX_COMPILER_ID MATCHES "Clang")',
                      "  target_compile_options(torrent-rasterbar PRIVATE",
                      "    -Wno-thread-safety-negative",
                      "    -Wno-thread-safety-analysis",
                      "    -Wno-sign-conversion",
                      "    -Wno-ms-bitfield-padding",
                      "    -Wno-nrvo",
                      "    -Wno-extra-semi-stmt",
                      "    -Wno-weak-vtables",
                      "    -Wno-old-style-cast",
                      "    -Wno-reserved-identifier",
                      "    -Wno-missing-variable-declarations",
                      "    -Wno-missing-prototypes",
                      "    -Wno-undef",
                      "  )",
                      "endif()",
                      "# ====================================",
                  ]
                  s += "\n".join(lines_to_add) + "\n"
                  p.write_text(s)
                  print("Patched third_party/libtorrent/CMakeLists.txt with warning suppressions")
              else:
                  print("libtorrent warning suppression already present")

          # ---------- H3. 移除 cmake/modules/Dependencies.cmake 中的 OpenSSL 版本锁 ----------
          p = Path("cmake/modules/Dependencies.cmake")
          if p.exists():
              s = p.read_text()
              s = s.replace('find_package(OpenSSL ${ARIA2_MIN_OPENSSL_VERSION}', 'find_package(OpenSSL')
              s = s.replace('${ARIA2_MIN_CURL_VERSION}', '')
              p.write_text(s)
              print("Patched cmake/modules/Dependencies.cmake - removed OpenSSL version pin")
          PYEOF

          # I. 同步更新 -v 字符串中的版本号
          python3 - <<'PYEOF'
          from pathlib import Path
          import re, os

          EXPAT_VERSION      = os.environ["EXPAT_VERSION"]
          SQLITE_VERSION     = os.environ["SQLITE_VERSION"]
          OPENSSL_VERSION    = os.environ["OPENSSL_VERSION"]
          BOOST_VERSION      = os.environ["BOOST_VERSION"]
          LIBTORRENT_VERSION = os.environ["LIBTORRENT_VERSION"]

          p = Path("src/FeatureConfig.cc")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'expat/[0-9.]+',                f'expat/{EXPAT_VERSION}',             s)
              s = re.sub(r'sqlite3/[0-9.]+',              f'sqlite3/{SQLITE_VERSION}',          s)
              s = re.sub(r'OpenSSL/[0-9.]+',              f'OpenSSL/{OPENSSL_VERSION}',         s)
              s = re.sub(r'Boost/[0-9.]+',                f'Boost/{BOOST_VERSION}',             s)
              s = re.sub(r'libtorrent/[0-9.]+',           f'libtorrent/{LIBTORRENT_VERSION}',   s)
              s = re.sub(r'LibtorrentRasterbar/[0-9.]+',  f'libtorrent/{LIBTORRENT_VERSION}',   s)
              p.write_text(s)
              print(f"FeatureConfig.cc updated: expat/{EXPAT_VERSION}, sqlite3/{SQLITE_VERSION}, OpenSSL/{OPENSSL_VERSION}, Boost/{BOOST_VERSION}, libtorrent/{LIBTORRENT_VERSION}")
          PYEOF

          # J. build-release 中 Release -> MinSizeRel
          #    精确替换 -DCMAKE_BUILD_TYPE=Release，失败只警告不阻断
          python3 - <<'PYEOF'
          from pathlib import Path

          p = Path("packaging/scripts/build-release")
          if not p.exists():
              raise SystemExit("ERROR: packaging/scripts/build-release not found")

          s = p.read_text()
          s2 = s.replace(
              '-DCMAKE_BUILD_TYPE=Release',
              '-DCMAKE_BUILD_TYPE=MinSizeRel'
          )

          if s2 == s:
              print("WARNING: no '-DCMAKE_BUILD_TYPE=Release' found in build-release; "
                    "verify MinSizeRel is applied by checking the CMake config step")
          else:
              p.write_text(s2)
              print("Patched packaging/scripts/build-release: Release -> MinSizeRel")
          PYEOF

      # ---------- 5. GPAC 头文件修复 + FFmpeg 体积优化 ----------
      #    不再对 GPAC configure 做 cross_compiling / gpac-conf 强制替换，
      #    GPAC 的 Exec format error 只是 configure 中间探测失败，不影响最终产物
      - name: Patch GPAC for mingw and optimize FFmpeg
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          # 修复 GPAC Windows 头文件大小写
          find third_party/gpac \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | \
            xargs -0 -r sed -i \
              -e 's/WinSock2\.h/winsock2.h/g' \
              -e 's/Windows\.h/windows.h/g' \
              -e 's/WS2tcpip\.h/ws2tcpip.h/g'

          # 修复 GPAC setup.h unsafe string 宏污染
          python3 - <<'PYEOF'
          from pathlib import Path
          import re

          p = Path('third_party/gpac/include/gpac/setup.h')
          if not p.exists():
              raise SystemExit('gpac/setup.h not found')

          s = p.read_text()
          s2 = re.sub(r'#ifndef\s+GPAC_ALLOW_UNSAFE_STRFUNC', '#if 0', s)
          if s2 != s:
              p.write_text(s2)
              print('Patched gpac/setup.h')
          else:
              print('No patch required')
          PYEOF

          # FFmpeg 开启体积优化
          python3 - <<'PYEOF'
          from pathlib import Path

          p = Path('cmake/superbuild/Media.cmake')
          if not p.exists():
              raise SystemExit('Media.cmake not found')

          s = p.read_text()
          if '--enable-small' not in s:
              old = '--enable-pic --enable-static'
              new = '--enable-pic --enable-static\n    --enable-small'
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s)
                  print('Added FFmpeg --enable-small')
              else:
                  raise SystemExit('FFmpeg configure anchor not found')
          else:
              print('--enable-small already exists')
          PYEOF

      # ---------- 6. 构建 ----------
      - name: Build release binary
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        shell: bash
        run: |
          bash packaging/scripts/build-release windows 2>&1 | tee build.log

      # ---------- 7. 校验 ----------
      - name: Verify actual dependency versions (source + installed)
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          echo "===== [1] Source tree versions ====="
          echo -n "Expat     : "
          grep -A2 'project(expat' third_party/expat/CMakeLists.txt 2>/dev/null \
            | grep -m1 -oP '\d+\.\d+\.\d+' || echo "N/A"
          echo -n "SQLite    : "
          grep -m1 -oP '#define\s+SQLITE_VERSION\s+"\K[0-9.]+' third_party/sqlite/sqlite3.h 2>/dev/null || echo "N/A"
          echo -n "OpenSSL   : "
          grep -m1 -oP 'OPENSSL_VERSION_TEXT\s+"[^0-9]*\K[0-9][0-9.a-z]*' third_party/openssl/include/openssl/opensslv.h 2>/dev/null || echo "N/A"
          echo -n "Boost     : "
          grep -m1 -oP '#define\s+BOOST_VERSION\s+\K[0-9]+' third_party/boost/boost/version.hpp 2>/dev/null \
            | awk '{printf "%d.%d.%d\n", $1/100000, ($1/100)%1000, $1%100}' || echo "N/A"
          echo -n "libtorrent: "
          grep -m1 -oP '#define\s+LIBTORRENT_VERSION\s+"\K[0-9.]+' third_party/libtorrent/include/libtorrent/version.hpp 2>/dev/null || echo "N/A"

          echo
          echo "===== [2] Installed dependency header versions ====="
          for f in \
            build/release/dependencies/include/sqlite3.h \
            build/release/dependencies/include/openssl/opensslv.h \
            build/release/dependencies/include/libtorrent/version.hpp \
            build/release/dependencies/include/expat.h ; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              grep -m1 -oP 'SQLITE_VERSION\s+"\K[0-9.]+' "$f" 2>/dev/null \
                || grep -m1 -oP 'OPENSSL_VERSION_TEXT\s+"[^0-9]*\K[0-9][0-9.a-z]*' "$f" 2>/dev/null \
                || grep -m1 -oP 'LIBTORRENT_VERSION\s+"\K[0-9.]+' "$f" 2>/dev/null \
                || grep -m1 -oP 'XML_ExpatVersion\s+"\K[0-9.]+' "$f" 2>/dev/null \
                || echo "(no matching version macro)"
            fi
          done

          echo
          echo "===== [3] CMakeCache entries ====="
          CACHE_FILE="build/release/CMakeCache.txt"
          if [ -f "$CACHE_FILE" ]; then
            echo "Cache file: $CACHE_FILE"
            grep -iE "LibtorrentRasterbar|Boost_INCLUDE|OPENSSL_ROOT|OPENSSL_INCLUDE|CMAKE_BUILD_TYPE|CMAKE_C_FLAGS|CMAKE_CXX_FLAGS" "$CACHE_FILE" 2>/dev/null | head -30 || true
          else
            echo "ERROR: $CACHE_FILE not found"
            echo "---- fallback: 查找所有 CMakeCache.txt ----"
            find build/release -name CMakeCache.txt 2>/dev/null || true
          fi

      - name: Inspect binary for embedded versions
        if: steps.check.outputs.skip != 'true'
        working-directory: aria2-next
        run: |
          BIN="build/release/aria2-next.exe"
          [ -f "$BIN" ] || { echo "Binary not found"; exit 0; }
          echo "=== Embedded dependency strings in binary ==="
          strings -n 4 "$BIN" | grep -iE "libtorrent/[0-9]|libtorrent [0-9]|Boost/[0-9]|Boost [0-9]|OpenSSL/[0-9]|OpenSSL [0-9]|sqlite3/[0-9]|sqlite [0-9]|expat/[0-9]" | sort -u | head -40
          echo "=== End ==="

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: aria2-next/build.log

      # ---------- 8. 打包与发布 ----------
      - name: Package binary
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p own-repo/release
          cp aria2-next/build/release/aria2-next.exe own-repo/release/aria2-next.exe

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aria2-next-windows-x64
          path: own-repo/release/aria2-next.exe

      - name: Create Release
        if: success() && steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: aria2-next
          allowUpdates: true
          artifacts: own-repo/release/aria2-next.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save upstream SHA cache
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check.outputs.new_sha }}
        continue-on-error: true
